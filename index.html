<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carousel Studio</title>
  <meta name="description" content="Legal information for the Carousel Studio app.">
  <style>
    :root {
      --bg: #ffffff;
      --text: #18181b;
      --muted: #52525b;
      --rule: #e4e4e7;
      --accent: #b45309;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --rule: #2e2e33;
        --accent: #ffb900;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 680px; margin: 0 auto; padding: 64px 24px 80px; }
    h1 { font-size: 2.25rem; line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
    .meta { margin: 10px 0 0; color: var(--muted); font-size: 0.9375rem; }
    ul { list-style: none; margin: 40px 0 0; padding: 0; border-top: 1px solid var(--rule); }
    li { border-bottom: 1px solid var(--rule); }
    li a { display: block; padding: 16px 0; color: var(--text); font-weight: 600; text-decoration: none; }
    li a::after { content: "›"; float: right; color: var(--muted); }
    li a:hover { color: var(--accent); }
    @media (max-width: 480px) {
      main { padding: 40px 20px 56px; }
      h1 { font-size: 1.875rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Carousel Studio</h1>
    <p class="meta">Jonathan Böhmer</p>
    <ul>
      <li><a href="carousel-studio/privacy/">Privacy Policy</a></li>
    </ul>
  </main>
</body>
</html>
